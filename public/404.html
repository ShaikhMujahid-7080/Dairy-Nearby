<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="refresh" content="0;url=/Dairy-Nearby/">
    <script>
      (function() {
        var l = window.location;
        var base = '/Dairy-Nearby';
        var path = l.pathname.replace(base, '');
        var redirect = base + '/#' + path + l.search + l.hash;
        l.replace(redirect);
      })();
    </script>
    <title>Redirecting…</title>
  </head>
  <body>Redirecting…</body>
</html>
