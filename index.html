    <script>
      // Prevent flash of wrong theme by respecting saved preference first, then system settings.
      (function() {
        try {
          const stored = localStorage.getItem('theme');
          const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          const shouldUseDark = stored ? stored === 'dark' : prefersDark;
          const root = document.documentElement;
          root.classList.toggle('dark', shouldUseDark);
          root.dataset.mode = shouldUseDark ? 'dark' : 'light';
          root.style.colorScheme = shouldUseDark ? 'dark' : 'light';
        } catch (error) {
          // If accessing storage fails, fall back to light theme to keep rendering predictable.
          const root = document.documentElement;
          root.classList.remove('dark');
          root.dataset.mode = 'light';
          root.style.colorScheme = 'light';
        }
      })();
    </script>
